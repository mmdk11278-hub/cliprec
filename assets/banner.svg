<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140829"/>
      <stop offset="55%" stop-color="#250864"/>
      <stop offset="100%" stop-color="#4B1AA8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5100A4"/>
      <stop offset="100%" stop-color="#7F54F8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD60A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD60A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="190" fill="#7F54F8" opacity="0.12"/>
  <circle cx="120" cy="290" r="150" fill="#FF3B30" opacity="0.08"/>

  <!-- icon -->
  <rect x="90" y="86" width="148" height="148" rx="36" fill="url(#badge)" stroke="#C4B5FD" stroke-width="2.5"/>
  <circle cx="164" cy="160" r="45" fill="none" stroke="#FFFFFF" stroke-width="11"/>
  <circle cx="164" cy="160" r="21" fill="#FF3B30"/>

  <!-- title -->
  <text x="272" y="146" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF">ClipRec</text>
  <text x="274" y="190" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" fill="#E9D5FF">Fast screen recorder · Direct MP4 · Clean voice · Tutorial mouse pointer</text>

  <!-- pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <rect x="274" y="218" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="349" y="240">CPU + RAM fast</text>
    <rect x="438" y="218" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="513" y="240">H.264 + AAC MP4</text>
    <rect x="602" y="218" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="677" y="240">No FFmpeg</text>
    <rect x="766" y="218" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="841" y="240">Lecture Mode</text>
    <rect x="930" y="218" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text x="1005" y="240">Video Editor</text>
  </g>

  <!-- cursor highlight demo -->
  <circle cx="1060" cy="120" r="46" fill="url(#glow)"/>
  <circle cx="1060" cy="120" r="30" fill="none" stroke="#FFD60A" stroke-width="4"/>
  <path d="M1052 104 L1052 140 L1061 132 L1067 146 L1073 143 L1067 130 L1079 130 Z" fill="#FFFFFF" stroke="#1C1C1C" stroke-width="2" stroke-linejoin="round"/>
</svg>
