[package]
name = "cliprec"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "cliprec"
path = "src/main.rs"

[[bin]]
name = "ClipRec-Setup"
path = "src/bin/cliprec-setup.rs"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
arboard = "3.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
cpal = "0.17"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Image encoding/capture is extremely slow without optimizations — optimize even dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
