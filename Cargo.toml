[package]
name = "cliprec"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
arboard = "3.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
cpal = "0.17"

# Image encoding/capture is extremely slow without optimizations — optimize even dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
